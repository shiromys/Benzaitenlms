# --- Benzaiten LMS: clean path alias for the Application Nexus Support API ---
#
# The Nexus integration spec requires each app to expose its Support API at
# a versioned, app-agnostic base path, e.g.:
#   https://api.yourapp.com/support/v1/tickets
# so the Nexus needs no per-app special cases. Internally this site's
# implementation lives in local/supportinbox/api.php (a plain PHP script,
# not a Moodle web service), so this file rewrites the clean external path
# onto that script, preserving everything after /support/v1 as PATH_INFO.
#
# Example:
#   /support/v1/tickets/42   ->  /local/supportinbox/api.php/tickets/42
#   /support/v1              ->  /local/supportinbox/api.php
#
# The rewritten URI still ends up going through 05-pathinfo.conf's
# "*.php/something" handling (that block's regex matches any .php path
# with a trailing slash-argument, not just pluginfile.php), so PATH_INFO
# reaches PHP-FPM correctly without this file needing its own fastcgi_pass
# block. `last` makes nginx re-run location matching on the new URI rather
# than serving this block's (nonexistent) content directly.
#
# This file's load order relative to 05-pathinfo.conf doesn't matter: `^~`
# makes this an explicit longest-prefix match for the ORIGINAL /support/v1
# request, independent of file read order, and the rewritten URI is
# matched fresh against every location block (including 05-pathinfo.conf)
# regardless of which file is read first.
location ^~ /support/v1 {
    rewrite ^/support/v1(/.*)?$ /local/supportinbox/api.php$1 last;
}