# --- Benzaiten LMS: PATH_INFO fix for slash-argument PHP URLs ---
#
# webdevops/php-nginx's default vhost.common.d/10-php.conf only matches
# requests whose URL literally ends in ".php" (location ~ \.php$). Moodle
# serves several things — SCORM SCO content via pluginfile.php, some
# theme/Snap asset routes, etc. — using "slash-argument" URLs of the form
#   /pluginfile.php/375/mod_scorm/content/1/index.html
# which do NOT end in .php, so they never match that block. Instead they
# fall through to the generic "location /" rule, which can't resolve them
# and Moodle's fallback bounces the browser to /my/ (Dashboard).
#
# This file is loaded from vhost.common.d BEFORE 10-php.conf (numeric
# prefix "05" sorts first), so it only intercepts the slash-argument case;
# a plain request ending in .php still falls through untouched to the
# original 10-php.conf block below it.
#
# IMPORTANT: confirm `fastcgi_pass` below matches the target used in your
# own /opt/docker/etc/nginx/vhost.common.d/10-php.conf before deploying —
# see the note sent alongside this file for how to check it.

location ~ ^(.+\.php)(/.+)$ {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;

    # Only proceed if the actual PHP script (without the trailing path
    # info) exists on disk — otherwise 404 instead of misrouting.
    try_files $fastcgi_script_name =404;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO       $fastcgi_path_info;

    # Default webdevops/php-nginx PHP-FPM socket. Change this if your
    # 10-php.conf uses something different (e.g. a unix socket path).
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
}