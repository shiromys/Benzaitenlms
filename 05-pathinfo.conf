# --- Benzaiten LMS: PATH_INFO fix for slash-argument PHP URLs ---
#
# webdevops/php-nginx's default vhost.common.d/10-php.conf only matches
# requests whose URL literally ends in ".php" (location ~ \.php$). Moodle
# serves several things — SCORM SCO content via pluginfile.php, some
# theme/Snap asset routes, etc. — using "slash-argument" URLs of the form
#   /pluginfile.php/375/mod_scorm/content/1/index.html
# which do NOT end in .php, so they never match that block. Instead they
# fall through to the generic "location /" rule, which can't resolve them
# and Moodle's fallback bounces the browser to /my/ (Dashboard).
#
# This file is loaded from vhost.common.d BEFORE 10-php.conf (numeric
# prefix "05" sorts first), so it only intercepts the slash-argument case;
# a plain request ending in .php still falls through untouched to the
# original 10-php.conf block below it.
#
# Verified 2026-09-08 against a real nginx + PHP-FPM instance with the
# exact SCORM-style request pattern: SCRIPT_FILENAME and PATH_INFO both
# come through correctly with this config as written.
#
# NOTE (fixed 2026-09-08): an earlier version of this file added
# `try_files $fastcgi_script_name =404;` here to reject requests for a
# nonexistent script cleanly. That directive has a well-known nginx
# side effect: it clears the capture that fastcgi_split_path_info had
# just set, so PATH_INFO reaches PHP as an empty string — which is
# exactly the "No valid arguments supplied or incorrect server
# configuration" error Moodle threw when this was tested. Removed.
# A request for a script that doesn't exist still 404s correctly —
# PHP-FPM itself returns 404 when SCRIPT_FILENAME doesn't resolve to a
# real file, so nothing is lost by dropping the try_files line.
#
# IMPORTANT: confirm `fastcgi_pass` below matches the target used in your
# own /opt/docker/etc/nginx/vhost.common.d/10-php.conf before deploying.
# 127.0.0.1:9000 is the documented default for this base image and this
# Dockerfile doesn't override it, but wasn't verified against your live
# container.

location ~ ^(.+\.php)(/.+)$ {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO       $fastcgi_path_info;

    # Default webdevops/php-nginx PHP-FPM socket. Change this if your
    # 10-php.conf uses something different (e.g. a unix socket path).
    fastcgi_pass   127.0.0.1:9000;
    fastcgi_index  index.php;
}